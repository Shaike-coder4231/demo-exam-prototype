<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПРОТОТИП — Бронирование | Сладкие сны</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <span class="badge">ПРОТОТИП</span>

    <header class="header">
        <div class="container">
            <div>
                <h1 class="logo">Сладкие сны</h1>
                <p class="slogan">Ваш уют — наша забота</p>
            </div>
            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h2>Бронирование номера</h2>

            <div id="roomInfo" class="room-info"></div>

            <form class="form" onsubmit="return false;">
                <label>Имя *
                    <input type="text" placeholder="Иван">
                </label>
                <label>Фамилия *
                    <input type="text" placeholder="Иванов">
                </label>
                <label>Телефон *
                    <input type="text" placeholder="+7(XXX)XXX-XX-XX">
                </label>
                <label>E-mail *
                    <input type="text" placeholder="example@mail.ru">
                </label>
                <label>Дата заезда *
                    <div class="date-wrap">
                        <input type="text" placeholder="ДД.ММ.ГГГГ">
                        <span>📅</span>
                    </div>
                </label>
                <label>Дата выезда *
                    <div class="date-wrap">
                        <input type="text" placeholder="ДД.ММ.ГГГГ">
                        <span>📅</span>
                    </div>
                </label>
                <button class="btn">Отправить заявку</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>📍 г. Москва, ул. Примерная, 15</p>
            <p>🕐 Круглосуточно, 24/7</p>
            <p>📞 +7 (495) 111-22-33</p>
            <p>✉ info@sweetdreams.ru</p>
        </div>
    </footer>

    <script>
        const rooms = {
            1: { name: 'Стандартный', price: '3 500 ₽/сутки' },
            2: { name: 'Студия', price: '5 500 ₽/сутки' },
            3: { name: 'Люкс', price: '9 000 ₽/сутки' },
            4: { name: 'Стандартный', price: '3 200 ₽/сутки' },
            5: { name: 'Студия', price: '6 000 ₽/сутки' },
            6: { name: 'Люкс', price: '10 000 ₽/сутки' }
        };
        const id = new URLSearchParams(location.search).get('room_id');
        if (id && rooms[id]) {
            document.getElementById('roomInfo').innerHTML =
                '<h3>Вы бронируете: ' + rooms[id].name + '</h3><p>' + rooms[id].price + '</p>';
        }
    </script>
</body>
</html>
